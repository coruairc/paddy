name: Paddy CI

# Canonical clean-environment validation for the Paddy fork.
#
# Every PR and every push to main:
#   1. installs dependencies from the lockfile,
#   2. builds from a clean checkout (no restored dist/.artifacts, so the
#      build-artifact cache is genuinely cold and the clean build path stays
#      exercised),
#   3. runs the repository's full validation gate
#      (pnpm build && pnpm check && pnpm check:test-types && pnpm test),
#   4. builds the container image from the repository Dockerfile,
#   5. smoke-tests the image (version/help/doctor/gateway start/gateway
#      auth-failure paths) via scripts/ci-container-smoke.sh.
#
# On main pushes only, the smoke-tested image is published to GHCR using the
# built-in GITHUB_TOKEN. Pull requests never publish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN needs packages:write for the GHCR publish step on main.
  packages: write

concurrency:
  group: paddy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm (version pinned by packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Matches the Dockerfile's node:24-bookworm toolchain.
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Repo checks
        run: pnpm check

      - name: Test typecheck
        run: pnpm check:test-types

      - name: Tests
        run: pnpm test

  container:
    name: Container build, smoke tests, publish
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: paddy-ci:smoke
          # Layer cache only; source changes invalidate layers, so this never
          # substitutes stale artifacts for the clean host build above.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: scripts/ci-container-smoke.sh paddy-ci:smoke

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/ci-docker-login-ghcr.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/${{ github.repository_owner }}/paddy"
          docker tag paddy-ci:smoke "${image}:${version}"
          docker tag paddy-ci:smoke "${image}:latest"
          docker push "${image}:${version}"
          docker push "${image}:latest"
