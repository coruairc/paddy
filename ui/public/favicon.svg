<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paddy-suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27a34f"/>
      <stop offset="100%" stop-color="#12562e"/>
    </linearGradient>
    <linearGradient id="paddy-beard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f09740"/>
      <stop offset="100%" stop-color="#b25d1c"/>
    </linearGradient>
    <linearGradient id="paddy-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d5ad"/>
      <stop offset="100%" stop-color="#e2b184"/>
    </linearGradient>
    <linearGradient id="paddy-cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a6249"/>
      <stop offset="100%" stop-color="#4a3a2b"/>
    </linearGradient>
  </defs>
  <!-- Paddy is the product mascot. This file is the single source of the mark:
       every app surface loads it via <img src>, including the shared native
       plugin fallback identity (see extensions/ICON_SOURCES.md), so replacing
       this file re-brands all bundled fallback icons at once.

       SMIL, not CSS: Chromium/Safari only run declarative SMIL inside
       <img>-loaded SVGs. Keeps the original mascot's animation vocabulary —
       float 4s, accent-sway 2s, blink 3s — so every surface that already
       expects those keyframes behaves identically with the new mark. -->
  <g>
    <animateTransform attributeName="transform" type="translate" additive="sum"
      values="0 0; 0 -5; 0 0" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <!-- Shoulders / suit -->
    <path d="M18 117 C20 99 38 91 60 91 C82 91 100 99 102 117 Z" fill="url(#paddy-suit)"/>

    <!-- Beard: deliberately wider than the face so it frames it at favicon size -->
    <path d="M60 40 C33 40 26 70 30 92 C33 106 45 115 60 115 C75 115 87 106 90 92 C94 70 87 40 60 40 Z"
      fill="url(#paddy-beard)"/>

    <!-- Ears -->
    <circle cx="40" cy="53" r="4.5" fill="#e2b184"/>
    <circle cx="80" cy="53" r="4.5" fill="#e2b184"/>

    <!-- Face -->
    <ellipse cx="60" cy="49" rx="19" ry="18" fill="url(#paddy-skin)"/>

    <!-- Flat cap, with the brim jutting forward -->
    <path d="M32 40 C13 38 9 49 26 51 L44 46 Z" fill="#3d2f22"/>
    <path d="M23 38 C23 19 40 9 60 9 C80 9 97 19 97 38 C97 43 92 45 85 45 L35 45 C28 45 23 43 23 38 Z"
      fill="url(#paddy-cap)"/>
    <path d="M26 37 Q60 29 94 37" stroke="#33271c" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Nose -->
    <ellipse cx="60" cy="55" rx="4.4" ry="3.6" fill="#e0a878"/>

    <!-- Eyes -->
    <circle cx="51" cy="48" r="4" fill="#101c14"/>
    <circle cx="69" cy="48" r="4" fill="#101c14"/>
    <circle cx="52" cy="47" r="1.6" fill="#7fe0a0">
      <animate attributeName="opacity" values="1; 1; 0.3; 1" keyTimes="0; 0.9; 0.95; 1"
        dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="47" r="1.6" fill="#7fe0a0">
      <animate attributeName="opacity" values="1; 1; 0.3; 1" keyTimes="0; 0.9; 0.95; 1"
        dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Shamrock lapel badge -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 86 104; -7 86 104; 7 86 104; 0 86 104" keyTimes="0; 0.25; 0.75; 1"
        dur="2s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <circle cx="86" cy="100" r="3" fill="#4ade80"/>
      <circle cx="82" cy="105.2" r="3" fill="#4ade80"/>
      <circle cx="90" cy="105.2" r="3" fill="#4ade80"/>
      <path d="M86 107.2 L86 112" stroke="#2e9c4f" stroke-width="1.7" stroke-linecap="round"/>
    </g>
  </g>
</svg>
